<!doctype html>
<meta charset="utf-8" />
<title>IAC iframe test</title>
<style>
  body {
    font: 14px sans-serif;
    margin: 16px;
  }
  .case {
    margin: 0 0 28px;
  }
  h3 {
    margin: 0 0 6px;
  }
  .box {
    border: 2px dashed #999;
    display: inline-block;
  }
</style>

<div class="case">
  <h3>1. Desktop 1200×800</h3>
  <div class="box" style="width: 1200px; height: 800px">
    <iframe width="100%" height="100%" frameborder="0"></iframe>
  </div>
</div>

<div class="case">
  <h3>2. Tablet 768×1024</h3>
  <div class="box" style="width: 768px; height: 1024px">
    <iframe width="100%" height="100%" frameborder="0"></iframe>
  </div>
</div>

<div class="case">
  <h3>3. Phone 375×667</h3>
  <div class="box" style="width: 375px; height: 667px">
    <iframe width="100%" height="100%" frameborder="0"></iframe>
  </div>
</div>

<div class="case">
  <h3>4. Short 1200×300</h3>
  <div class="box" style="width: 1200px; height: 300px">
    <iframe width="100%" height="100%" frameborder="0"></iframe>
  </div>
</div>

<div class="case">
  <h3>5. Parent with no height set (likely worst case)</h3>
  <div class="box" style="width: 900px">
    <iframe width="100%" height="100%" frameborder="0"></iframe>
  </div>
</div>

<div class="case">
  <h3>6. Real host (GIFI page): frame = 100vh, starts ~117px down the page</h3>
  <!-- Host CSS: .embedded-iframe-container { height: 100vh; overflow: hidden }
       below a ~117px breadcrumb bar (estimate). Scroll so the bar's top meets
       the window top: the frame's bottom 117px are then below the window. -->
  <div style="height: 117px; background: #000"></div>
  <div style="height: 100vh; overflow: hidden">
    <iframe width="100%" height="100%" frameborder="0"></iframe>
  </div>
</div>

<script>
  const SRC =
    "https://cdtrich.github.io/internet-accountability-compass-staging/";
  document.querySelectorAll("iframe").forEach((f) => (f.src = SRC));
</script>
